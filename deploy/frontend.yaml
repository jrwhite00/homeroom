apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: homeroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: homeroom
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          # Built locally and imported into the kind nodes; see Commands in CLAUDE.md.
          image: homeroom-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: OTEL_SERVICE_NAME
              value: homeroom-frontend
            # Browser monitoring (@dash0/sdk-web). Optional: without the secret the page sends nothing.
            - name: DASH0_WEB_URL
              valueFrom:
                secretKeyRef: {name: homeroom-dash0-web, key: url, optional: true}
            - name: DASH0_WEB_TOKEN
              valueFrom:
                secretKeyRef: {name: homeroom-dash0-web, key: token, optional: true}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: homeroom
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
