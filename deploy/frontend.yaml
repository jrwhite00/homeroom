apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: homeroom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: homeroom
    spec:
      automountServiceAccountToken: false  # no container here calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across real nodes. ScheduleAnyway: the kind cluster has one worker, and
      # Honor skips the tainted KWOK talk nodes so they don't count as places to spread to.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      containers:
        - name: frontend
          # Built locally and imported into the kind nodes; see Commands in CLAUDE.md.
          image: homeroom-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: OTEL_SERVICE_NAME
              value: homeroom-frontend
            # Browser monitoring (@dash0/sdk-web). Optional: without the secret the page sends nothing.
            - name: DASH0_WEB_URL
              valueFrom:
                secretKeyRef: {name: homeroom-dash0-web, key: url, optional: true}
            - name: DASH0_WEB_TOKEN
              valueFrom:
                secretKeyRef: {name: homeroom-dash0-web, key: token, optional: true}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: next-cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: homeroom
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Voluntary disruptions (node drains, upgrades) take down at most one frontend pod at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: homeroom
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
