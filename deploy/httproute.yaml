apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeroom
  namespace: homeroom
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: demo
      namespace: demo
  hostnames:
    - homeroom.localhost
  rules:
    # /api/* goes to the backend with the /api prefix stripped, so /api/healthz -> /healthz.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: backend
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
