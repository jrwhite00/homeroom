apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeroom
spec:
  # No replicas field: the HorizontalPodAutoscaler below owns the count (fixed at one until process-local state is shared).
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: homeroom
    spec:
      automountServiceAccountToken: false  # no container here calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across real nodes. ScheduleAnyway: the kind cluster has one worker, and
      # Honor skips the tainted KWOK talk nodes so they don't count as places to spread to.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          # Built locally and imported into the kind nodes; see Commands in CLAUDE.md.
          image: homeroom-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: homeroom-backend
            # Elasticsearch is the start-local container (es-local-dev), joined to the kind network so
            # pods reach it by name. Its API key comes from a secret; see Commands in CLAUDE.md.
            - name: ES_URL
              value: http://es-local-dev:9200
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homeroom-es
                  key: api_key
                  optional: true
            # The chaos switch's token. Optional: without the secret the switch can't be flipped.
            - name: CHAOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homeroom-chaos
                  key: token
                  optional: true
            # Course proposals open pull requests with a repo-scoped token. Optional: without the
            # secret, proposals are saved to data/proposed-courses/ instead.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homeroom-github
                  key: token
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # Course proposals fall back to files here when there's no GitHub token.
            - {name: proposed-courses, mountPath: /data/proposed-courses}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: proposed-courses, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeroom
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Keep one backend replica until process-local chaos-switch and rate-limit state is shared.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeroom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Voluntary disruptions (node drains, upgrades) take down at most one backend pod at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeroom
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
