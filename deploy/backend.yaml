apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: homeroom
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          # Built locally and imported into the kind nodes; see Commands in CLAUDE.md.
          image: homeroom-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: homeroom-backend
            # The chaos switch's token. Optional: without the secret the switch can't be flipped.
            - name: CHAOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homeroom-chaos
                  key: token
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: homeroom
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: homeroom
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
