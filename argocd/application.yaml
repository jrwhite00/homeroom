# Applied once by hand (see Commands in CLAUDE.md). Kept outside deploy/ so the app does not manage itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeroom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jrwhite00/homeroom
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: homeroom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  # The load generator is started on demand with kubectl scale; don't scale it back to 0.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: loadgen
      namespace: homeroom
      jsonPointers:
        - /spec/replicas
